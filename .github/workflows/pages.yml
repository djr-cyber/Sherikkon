# Publishes the ready site (deploy/) to GitHub Pages on every push to main.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # this copy is a preview: keep it out of search results so it never competes with sherikkon.uz
      - name: Mark preview as noindex
        run: sed -i 's#<head>#<head><meta name="robots" content="noindex">#' deploy/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: deploy
      - id: deployment
        uses: actions/deploy-pages@v4
